
services:
  db:
    image: postgres:17
    container_name: sedp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sedp
      POSTGRES_USER: sedp_user
      POSTGRES_PASSWORD: ${SEDP_DB_PASSWORD:?Defina SEDP_DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sedp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sedp_user -d sedp"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sedp-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sedp_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: sedp-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${SEDP_GRAFANA_ADMIN_PASSWORD:?Defina SEDP_GRAFANA_ADMIN_PASSWORD no arquivo .env}
    volumes:
      - sedp_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  sedp_postgres_data:
  sedp_prometheus_data:
  sedp_grafana_data:
