[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-equipment-diagnostic-platform"
version = "0.1.0"
description = "Diagnostic platform for scientific equipment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]