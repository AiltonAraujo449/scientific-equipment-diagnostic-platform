[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-equipment-diagnostic-platform"
version = "0.1.0"
description = "Diagnostic platform for scientific equipment"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]